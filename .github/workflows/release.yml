name: Release

# Triggers:
#   - Push a version tag:  git tag v0.1.1 && git push --tags
#   - Manually via GitHub Actions UI (workflow_dispatch)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.1)'
        required: false
        default: ''

# Allow writing to releases
permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── 3. Rust ────────────────────────────────────────────────────────────
      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ── 4. Rust cache ──────────────────────────────────────────────────────
      # Caches ~/.cargo/registry and src-tauri/target across runs.
      # A cold build (new crates) takes ~12 min; warm build ~3 min.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      # ── 5. WebView2 ────────────────────────────────────────────────────────
      # windows-latest already has WebView2 runtime. This step is a no-op
      # but documents the dependency explicitly.
      - name: Verify WebView2 runtime
        run: |
          $ver = (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue).pv
          if (-not $ver) { $ver = "pre-installed (Windows 11 default)" }
          Write-Host "WebView2: $ver"
        shell: pwsh

      # ── 6. Frontend deps ───────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      # ── 7. Tauri updater signing keys ──────────────────────────────────────
      # TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      # must be set in: GitHub → Settings → Secrets → Actions
      # Generate with: npx @tauri-apps/cli signer generate -w tazama.key
      # Then add tazama.key contents as TAURI_SIGNING_PRIVATE_KEY secret.
      # Leave TAURI_SIGNING_PRIVATE_KEY_PASSWORD empty if you used no password.

      # ── 8. Build ───────────────────────────────────────────────────────────
      - name: Build Tazama AI (release)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc
        env:
          # Required for Tauri updater signatures (even if updater not configured,
          # set a dummy key so the build doesn't fail looking for env vars).
          # Once you have a real key, add it as a GitHub secret.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # Keep Rust incremental compilation in CI
          CARGO_INCREMENTAL: '1'

      # ── 9. Locate artifacts ────────────────────────────────────────────────
      - name: Locate build artifacts
        id: artifacts
        run: |
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi  = Get-ChildItem "src-tauri/target/release/bundle/msi"  -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $exe  = Get-ChildItem "src-tauri/target/release" -Filter "tazama-ai.exe" -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($nsis) {
            Write-Host "NSIS installer: $($nsis.FullName) ($([math]::Round($nsis.Length/1MB,1)) MB)"
            echo "nsis_path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT
            echo "nsis_name=$($nsis.Name)"      >> $env:GITHUB_OUTPUT
          }
          if ($msi) {
            Write-Host "MSI installer: $($msi.FullName) ($([math]::Round($msi.Length/1MB,1)) MB)"
            echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
            echo "msi_name=$($msi.Name)"     >> $env:GITHUB_OUTPUT
          }
          if ($exe) {
            Write-Host "Standalone exe: $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"
            echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      # ── 10. Determine version ──────────────────────────────────────────────
      - name: Determine release version
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}"
          } elseif ("${{ inputs.version }}" -ne "") {
            $ver = "v${{ inputs.version }}"
          } else {
            $json = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
            $ver  = "v$($json.version)-dev"
          }
          Write-Host "Release version: $ver"
          echo "tag=$ver" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # ── 11. Create GitHub Release & upload artifacts ───────────────────────
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Tazama AI ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, 'dev') || contains(steps.version.outputs.tag, 'alpha') || contains(steps.version.outputs.tag, 'beta') }}
          generate_release_notes: true
          body: |
            ## Tazama AI ${{ steps.version.outputs.tag }}

            **Your screen buddy that watches along.**

            ### Install

            Download the installer below and double-click to install.
            No Rust, no Node, no build tools required.

            | File | Description |
            |------|-------------|
            | `*-setup.exe` | Recommended — NSIS installer (~15 MB) |
            | `*.msi` | Alternative — Windows Installer package |

            ### What's new

            See the full commit history in [CHANGELOG](https://github.com/${{ github.repository }}/commits/master).

            ### Requirements

            - Windows 10 version 1809 or later (64-bit)
            - Edge WebView2 Runtime (pre-installed on Windows 11; auto-downloaded on Windows 10)

            ### First run

            1. Open **Settings → AI Providers**
            2. Add at least one API key (Anthropic, OpenAI, Groq, NVIDIA, or Fish Audio)
            3. Keys are stored in the Windows Credential Manager — never in plain text

          files: |
            ${{ steps.artifacts.outputs.nsis_path }}
            ${{ steps.artifacts.outputs.msi_path }}

      # ── 12. Upload standalone exe as workflow artifact (always) ─────────────
      # Useful for testing PRs without creating a release.
      - name: Upload exe as workflow artifact
        if: steps.artifacts.outputs.exe_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: tazama-ai-${{ steps.version.outputs.tag }}-windows-x64
          path: ${{ steps.artifacts.outputs.exe_path }}
          retention-days: 14

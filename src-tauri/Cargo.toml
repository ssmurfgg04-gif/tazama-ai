[package]
name = "tazama-ai"
version = "0.2.2"
description = "Tazama AI -- your screen buddy that watches along"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tazama_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-keyring = "0.1.0"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
base64 = "0.22"
xcap = "0.9"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", features = ["png"] }

# ── Windows-only: UIA element walk + SendKeys actuation ──
# Linux builds compile without these; capture.rs provides stubs (see cfg gates).
[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
windows = { version = "0.59", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1

[dev-dependencies]
# Same `keyring` the plugin wraps (unifies to the locked 3.6.x): lets tests
# drive the real Credential Manager without constructing an App (mock apps
# cannot run on this host -- see secrets.rs module docs).
keyring = "3.6"
wiremock = "0.6.5"


